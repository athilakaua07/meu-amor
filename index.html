<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Texto + US Animado</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family: Arial, Helvetica, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:80%;
  max-width:800px;
}

/* TEXTO NORMAL */
#texto{
  font-size:18px;
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
  color:white;
}

/* US CONTAINER */
.us-container{
  margin-top:30px;
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:15px;
}

/* US BOX */
.us-box{
  background:#000;
  border:1px solid #444;
  height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  color:#aaa;
  border-radius:10px;

  opacity:0;
  transform: translateY(20px);
  position:relative;
  overflow:hidden;
}

/* animação entrada */
.us-box.show{
  animation: aparecer 0.6s ease forwards;
}

/* glitch só nos US */
.us-box.show::before,
.us-box.show::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  opacity:0;
}

.us-box.show::before{
  background:#ff00ff;
  animation: glitch 1.2s infinite;
  mix-blend-mode:screen;
}

.us-box.show::after{
  background:#00ffff;
  animation: glitch 0.9s infinite;
  mix-blend-mode:screen;
}

@keyframes aparecer{
  from{
    opacity:0;
    transform: translateY(20px);
  }
  to{
    opacity:1;
    transform: translateY(0);
  }
}

@keyframes glitch{
  0%{transform:translate(0); opacity:0.2;}
  20%{transform:translate(-2px,2px);}
  40%{transform:translate(2px,-2px);}
  60%{transform:translate(-1px,1px);}
  80%{transform:translate(1px,-1px);}
  100%{transform:translate(0); opacity:0;}
}

</style>
</head>

<body>

<div class="container">
  <div id="texto"></div>

  <div class="us-container">
    <div class="us-box">US SLOT 1</div>
    <div class="us-box">US SLOT 2</div>
    <div class="us-box">US SLOT 3</div>
    <div class="us-box">US SLOT 4</div>
  </div>
</div>

<script>

const textoCompleto = `COLE SEU TEXTO AQUI

(coloque aqui exatamente o seu texto completo, sem cortar nada)

Ele vai aparecer inteiro antes dos US slots.`

const textoEl = document.getElementById("texto");
const usBoxes = document.querySelectorAll(".us-box");

let i = 0;

function digitar(){
  if(i < textoCompleto.length){
    textoEl.innerHTML += textoCompleto.charAt(i);
    i++;
    setTimeout(digitar, 18);
  } else {
    mostrarUS();
  }
}

function mostrarUS(){
  usBoxes.forEach((box, index) => {
    setTimeout(() => {
      box.classList.add("show");
    }, index * 300);
  });
}

digitar();

</script>

</body>
</html>
