<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cyber UI</title>

<style>
body{
  margin:0;
  background:#050505;
  color:#00ffcc;
  font-family: "Courier New", monospace;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

/* CONTAINER */
.container{
  width:80%;
  max-width:800px;
}

/* TEXTO */
#texto{
  font-size:18px;
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
  text-shadow:0 0 5px #00ffcc;
}

/* efeito glitch no texto */
.glitch {
  animation: glitchText 0.2s infinite;
}

@keyframes glitchText {
  0%   { transform: translate(0); opacity:1; }
  20%  { transform: translate(-1px,1px); }
  40%  { transform: translate(1px,-1px); }
  60%  { transform: translate(-1px,0); }
  80%  { transform: translate(1px,1px); }
  100% { transform: translate(0); }
}

/* US CONTAINER */
.us-container{
  margin-top:30px;
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:15px;
}

/* US BOX */
.us-box{
  background:rgba(0,0,0,0.8);
  border:1px solid #00ffcc;
  height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  color:#00ffcc;
  border-radius:10px;

  opacity:0;
  transform: translateY(20px);
  position:relative;
  overflow:hidden;
}

/* glitch visual nas caixas */
.us-box::before,
.us-box::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:inherit;
  mix-blend-mode:screen;
  opacity:0;
}

.us-box.show{
  animation: aparecer 0.6s ease forwards;
}

.us-box.show::before{
  animation: glitchBox 1.2s infinite;
  background:#ff00ff;
}

.us-box.show::after{
  animation: glitchBox 0.9s infinite;
  background:#00ffff;
}

@keyframes aparecer{
  from{
    opacity:0;
    transform: translateY(20px);
  }
  to{
    opacity:1;
    transform: translateY(0);
  }
}

@keyframes glitchBox{
  0%{transform:translate(0); opacity:0.2;}
  20%{transform:translate(-2px,2px);}
  40%{transform:translate(2px,-2px);}
  60%{transform:translate(-1px,1px);}
  80%{transform:translate(1px,-1px);}
  100%{transform:translate(0); opacity:0;}
}

</style>
</head>

<body>

<div class="container">
  <div id="texto"></div>

  <div class="us-container">
    <div class="us-box">US SLOT 1</div>
    <div class="us-box">US SLOT 2</div>
    <div class="us-box">US SLOT 3</div>
    <div class="us-box">US SLOT 4</div>
  </div>
</div>

<script>

const textoCompleto = `>>> INITIALIZING SYSTEM...
>>> CONNECTING NODE...
>>> ACCESS GRANTED

SEU TEXTO AQUI...
coloque tudo aqui sem corte.

O sistema vai renderizar tudo antes dos slots US.`

const textoEl = document.getElementById("texto");
const usBoxes = document.querySelectorAll(".us-box");

let i = 0;

function glitchRandom(){
  textoEl.classList.add("glitch");
  setTimeout(() => {
    textoEl.classList.remove("glitch");
  }, 120);
}

function digitar(){
  if(i < textoCompleto.length){

    textoEl.innerHTML += textoCompleto.charAt(i);

    // glitch aleatório durante digitação
    if(Math.random() < 0.08){
      glitchRandom();
    }

    i++;
    setTimeout(digitar, 18);
  } else {
    mostrarUS();
  }
}

function mostrarUS(){
  usBoxes.forEach((box, index) => {
    setTimeout(() => {
      box.classList.add("show");
    }, index * 350);
  });
}

digitar();

</script>

</body>
</html>
