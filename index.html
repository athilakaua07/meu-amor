<script>

// estrelas
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.classList.add("star");
s.style.top=Math.random()*100+"vh";
s.style.left=Math.random()*100+"vw";
document.body.appendChild(s);
}

// texto completo
const text=`Depois que eu vi aquilo que vc fez pra mim, eu fiquei um tempo olhando pra tela...

Não foi só por ler… foi porque eu senti cada palavra.

Eu não sei em que momento você virou alguém tão presente pra mim.

Hoje qualquer coisa que acontece eu penso em você.

E eu quero continuar com voce até o fim. 🤍`;

let i=0;

function typing(){
if(i < text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typing, 30);
}else{

// ✅ QUANDO TERMINA O TEXTO -> MOSTRA US
document.querySelector(".us-section").style.display = "grid";

// final também ativa aqui
document.getElementById("finalText").classList.add("active");
}
}

window.addEventListener("scroll",()=>{

// agora o scroll NÃO controla mais US nem texto
// (pode até remover depois se quiser)

});

// revelar fotos
document.querySelectorAll(".us-card").forEach(card=>{
card.onclick=()=>card.classList.add("active");
});

// entrada
document.getElementById("startScreen").onclick=()=>{
document.getElementById("startScreen").style.display="none";
document.getElementById("content").style.display="block";

let m=document.getElementById("music");
m.volume=0;
m.play();

let v=0;
let fade=setInterval(()=>{
if(v<0.4){v+=0.02;m.volume=v;}
else clearInterval(fade);
},200);

for(let i=0;i<50;i++) createExplosionPetal();
};

// botão música
document.getElementById("musicBtn").onclick=()=>{
let m=document.getElementById("music");
m.paused?m.play():m.pause();
};

// corações
setInterval(()=>{
let h=document.createElement("div");
h.innerHTML="💕";
h.classList.add("heart");
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(Math.random()*20+15)+"px";
h.style.animationDuration=(Math.random()*4+4)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),7000);
},300);

// explosão
function createExplosionPetal(){
let p=document.createElement("div");
p.innerHTML="🌸";
p.classList.add("petal");
p.style.left="50%";
p.style.top="50%";
p.style.fontSize=(Math.random()*20+15)+"px";

document.body.appendChild(p);

let a=Math.random()*2*Math.PI;
let d=Math.random()*400+200;

p.animate([
{transform:"translate(0,0)",opacity:1},
{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}
],{duration:1500});

setTimeout(()=>p.remove(),1500);
}

</script>
