<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Gabrielly 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(-45deg,#8b0000,#2d0000,#000,#4b0000);
    background-size:400% 400%;
    animation:gradientBG 10s ease infinite;
    color:#fff;
    overflow-x:hidden;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* estrelas */
.star{
    position:fixed;
    width:2px;
    height:2px;
    background:white;
    opacity:0.8;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:0.2;}
    to{opacity:1;}
}

/* start */
#startScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    cursor:pointer;
}

/* content */
#content{
    display:none;
    position:relative;
    z-index:2;
    text-align:center;
}

/* nome */
.name{
    margin-top:60px;
    font-family:'Great Vibes';
    font-size:4rem;
    color:#ff85a2;
}

/* 💖 FRASES DO TOPO (RESTORE) */
.love-section{
    margin:60px auto;
    max-width:700px;
}

.love-item{
    margin-bottom:80px;
}

.love-text{
    font-family:'Great Vibes';
    font-size:2.2rem;
    margin-bottom:20px;
}

.love-item img{
    width:100%;
    max-height:70vh;
    object-fit:contain;
    border-radius:15px;
}

/* TEXTO */
.letter{
    max-width:700px;
    margin:80px auto;
    font-size:1.1rem;
    line-height:1.8;
    padding:20px;
    text-align:left;
    min-height:200px;
}

/* US SECTION (AGORA 11 SLOTS) */
.us-section{
    max-width:900px;
    margin:60px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

/* CARD */
.us-card{
    position:relative;
    height:160px;
    background:#000;
    border:1px solid #222;
    border-radius:15px;
    cursor:pointer;
    overflow:hidden;

    opacity:0;
    transform:translateY(20px) scale(0.95);
    transition:0.6s;
}

.us-card.show{
    opacity:1;
    transform:translateY(0) scale(1);
}

/* US? */
.us-card::before{
    content:"US?";
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Great Vibes';
    font-size:2.5rem;
    color:#fff;
    transition:0.5s;
}

/* imagem */
.us-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:0.5s;
}

.us-card.active img{opacity:1;}
.us-card.active::before{opacity:0;}

/* final */
.final{
    font-family:'Great Vibes';
    font-size:3.5rem;
    margin:120px 0;
    opacity:0;
    transform:scale(0.5);
    transition:1s;
}

.final.active{
    opacity:1;
    transform:scale(1.2);
    text-shadow:0 0 25px #ff4d6d;
}

/* botão música */
.music-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#ff4d6d;
    border:none;
    border-radius:50%;
    width:50px;
    height:50px;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="startScreen">
<h1>clique para entrar 🤍</h1>
</div>

<div id="content">

<h1 class="name">Gabrielly 💕</h1>

<!-- 💖 RESTAURADO -->
<section class="love-section">
<div class="love-item">
<div class="love-text">Eu amo você como o Joe ama a Love</div>
<img src="amm.jpg">
</div>

<div class="love-item">
<div class="love-text">Eu amo você como o Leon ama a Ada</div>
<img src="aa.jpg.jfif">
</div>

<div class="love-item">
<div class="love-text">Eu amo você como o Escanor ama a Merlin</div>
<img src="cc.jpg.jfif">
</div>
</section>

<div class="letter" id="typing"></div>

<!-- 🔥 11 US SLOTS (3 antigos + 4 novos + 4 extras) -->
<section class="us-section">

<div class="us-card"><img src="amm.jpg"></div>
<div class="us-card"><img src="aa.jpg.jfif"></div>
<div class="us-card"><img src="cc.jpg.jfif"></div>

<!-- NOVOS 4 -->
<div class="us-card"><img src="amm.jpg"></div>
<div class="us-card"><img src="aa.jpg.jfif"></div>
<div class="us-card"><img src="cc.jpg.jfif"></div>
<div class="us-card"><img src="amm.jpg"></div>

<!-- EXTRAS 4 -->
<div class="us-card"><img src="aa.jpg.jfif"></div>
<div class="us-card"><img src="cc.jpg.jfif"></div>
<div class="us-card"><img src="amm.jpg"></div>
<div class="us-card"><img src="aa.jpg.jfif"></div>

</section>

<div class="final" id="finalText">Eu te amo Gabrielly 💕</div>

</div>

<script>

/* estrelas */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.classList.add("star");
s.style.top=Math.random()*100+"vh";
s.style.left=Math.random()*100+"vw";
document.body.appendChild(s);
}

/* TEXTO COMPLETO */
const text=`Depois que eu vi aquilo que vc fez pra mim, eu fiquei um tempo olhando pra tela depois de terminar de ler…

Não foi só por ler… foi porque eu senti cada palavra.

É estranho explicar, mas parecia que enquanto eu lia, eu tava revivendo tudo… cada conversa, cada momento simples que acabou ficando importante sem a gente nem perceber.

Eu não sei em que momento você virou alguém tão presente pra mim. Só sei que hoje, qualquer coisa que acontece, é automático pensar em você.

Tipo “preciso contar isso pra ela”.

Tem dias que eu nem tô tão bem, mas aí lembro de você… e parece que tudo fica mais leve.

Você tem esse jeito de acalmar as coisas dentro de mim sem nem tentar.

E eu gosto disso na gente.

Gosto de como é leve… mas ao mesmo tempo tão intenso.

Sem pressão, sem pressa, sem precisar definir tudo.

Só sendo.

E sendo algo bom.

Eu tambem não sei exatamente onde isso vai dar…

Mas sei que eu quero continuar com voce até o fim.

Sem pressa… mas só nós dois, do nosso jeito. 🤍`;

let i=0;
let started=false;

function typing(){
if(i < text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typing,30);
}else{
document.getElementById("finalText").classList.add("active");
revealUS();
}
}

/* US aparece um por um */
function revealUS(){
const cards = document.querySelectorAll(".us-card");
cards.forEach((c,i)=>{
setTimeout(()=>{
c.classList.add("show");
}, i*250);
});
}

/* start */
document.getElementById("startScreen").onclick=()=>{
document.getElementById("startScreen").style.display="none";
document.getElementById("content").style.display="block";

typing();
};

/* clicar US */
document.querySelectorAll(".us-card").forEach(card=>{
card.onclick=()=>card.classList.toggle("active");
});

</script>

</body>
</html>
