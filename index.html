<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Gabrielly 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(-45deg,#8b0000,#2d0000,#000,#4b0000);
    background-size:400% 400%;
    animation:gradientBG 10s ease infinite;
    color:#fff;
    overflow-x:hidden;
}

/* 🌈 FUNDO ANIMADO */
@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* 💕 CORAÇÕES */
.heart{
    position:fixed;
    pointer-events:none;
    animation:fall linear forwards;
    filter:drop-shadow(0 0 6px #ff4d6d);
}

@keyframes fall{
    to{transform:translateY(100vh);opacity:0;}
}

/* 🌸 PÉTALAS COM BRILHO */
.petal{
    position:fixed;
    pointer-events:none;
    filter:drop-shadow(0 0 8px pink);
}

/* TELA INICIAL */
#startScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    cursor:pointer;
}

#startScreen h1{
    font-family:'Great Vibes';
    font-size:3rem;
}

/* CONTEÚDO */
#content{
    display:none;
    position:relative;
    z-index:2;
    text-align:center;
}

/* NOME */
.name{
    margin-top:60px;
    font-family:'Great Vibes';
    font-size:4rem;
    color:#ff85a2;
    animation:fadeIn 2s ease;
}

/* TRANSIÇÃO */
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;}
}

/* SEÇÃO */
.love-section{
    margin:60px auto;
    max-width:700px;
}

.love-item{
    margin-bottom:80px;
    transition:0.5s;
}

.love-item:hover{
    transform:scale(1.02);
}

.love-text{
    font-family:'Great Vibes';
    font-size:2.2rem;
    margin-bottom:20px;
}

.love-item img{
    width:100%;
    max-height:70vh;
    object-fit:contain;
    border-radius:15px;
}

/* CARTA */
.letter{
    max-width:700px;
    margin:80px auto;
    font-size:1.1rem;
    line-height:1.8;
    padding:20px;
    text-align:left;
    min-height:200px;
}

/* FINAL 💥 */
.final{
    font-family:'Great Vibes';
    font-size:3.5rem;
    text-align:center;
    margin:120px 0;
    opacity:0;
    transform:scale(0.5);
    transition:1s;
}

.final.active{
    opacity:1;
    transform:scale(1.2);
    text-shadow:0 0 20px #ff4d6d;
}

/* BOTÃO MÚSICA */
.music-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#ff4d6d;
    border:none;
    border-radius:50%;
    width:50px;
    height:50px;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    z-index:999;
}
</style>
</head>

<body>

<div id="startScreen">
    <h1>clique para entrar 🤍</h1>
</div>

<div id="content">

<h1 class="name">Gabrielly 💕</h1>

<section class="love-section">

<div class="love-item">
    <div class="love-text">Eu amo você como o Joe ama a Love</div>
    <img src="amm.jpg">
</div>

<div class="love-item">
    <div class="love-text">Eu amo você como o Leon ama a Ada</div>
    <img src="aa.jpg.jfif">
</div>

<div class="love-item">
    <div class="love-text">Eu amo você como o Escanor ama a Merlin</div>
    <img src="cc.jpg.jfif">
</div>

</section>

<div class="letter" id="typing"></div>

<div class="final" id="finalText">Eu te amo Gabrielly 💕</div>

</div>

<!-- 🎵 MÚSICA -->
<audio id="music" loop>
<source src="Arctic Monkeys - Do I Wanna Know_ (Lyrics) [PUL2mVdt3xo].mp3">
</audio>

<button class="music-btn" id="musicBtn">🔊</button>

<script>

// TEXTO DIGITANDO
const text = `Depois que eu vi aquilo que vc fez pra mim, eu fiquei um tempo olhando pra tela...

Não foi só por ler… foi porque eu senti cada palavra.

Eu não sei em que momento você virou alguém tão presente pra mim...

Mas sei que eu quero continuar com voce até o fim. 🤍`;

let i = 0;
function typing(){
    if(i < text.length){
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typing,30);
    }else{
        document.getElementById("finalText").classList.add("active");
    }
}

// ENTRADA
document.getElementById("startScreen").onclick = () => {

    document.getElementById("startScreen").style.display="none";
    document.getElementById("content").style.display="block";

    document.getElementById("music").volume=0;
    document.getElementById("music").play();

    // fade-in música
    let vol = 0;
    const fade = setInterval(()=>{
        if(vol < 0.4){
            vol += 0.02;
            document.getElementById("music").volume = vol;
        }else{
            clearInterval(fade);
        }
    },200);

    typing();

    for(let i=0;i<50;i++){
        createExplosionPetal();
    }
};

// BOTÃO MÚSICA
const music = document.getElementById("music");
document.getElementById("musicBtn").onclick = ()=>{
    if(music.paused){
        music.play();
    }else{
        music.pause();
    }
};

// CORAÇÕES
setInterval(()=>{
    const h = document.createElement("div");
    h.innerHTML="💕";
    h.classList.add("heart");
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(Math.random()*20+15)+"px";
    h.style.animationDuration=(Math.random()*4+4)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
},300);

// EXPLOSÃO 🌸
function createExplosionPetal(){
    const p=document.createElement("div");
    p.innerHTML="🌸";
    p.classList.add("petal");
    p.style.left="50%";
    p.style.top="50%";
    p.style.fontSize=(Math.random()*20+15)+"px";

    document.body.appendChild(p);

    const angle=Math.random()*2*Math.PI;
    const dist=Math.random()*400+200;

    p.animate([
        {transform:"translate(0,0)",opacity:1},
        {transform:`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`,opacity:0}
    ],{duration:1500});

    setTimeout(()=>p.remove(),1500);
}

</script>

</body>
</html>
