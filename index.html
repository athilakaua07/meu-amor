<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Gabrielly 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(-45deg,#8b0000,#2d0000,#000,#4b0000);
    background-size:400% 400%;
    animation:gradientBG 10s ease infinite;
    color:#fff;
    overflow-x:hidden;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* estrelas */
.star{
    position:fixed;
    width:2px;
    height:2px;
    background:white;
    opacity:0.8;
    z-index:0;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:0.2;}
    to{opacity:1;}
}

/* corações */
.heart{
    position:fixed;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    to{transform:translateY(100vh);opacity:0;}
}

/* pétalas */
.petal{
    position:fixed;
    pointer-events:none;
    filter:drop-shadow(0 0 8px pink);
}

/* start */
#startScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    cursor:pointer;
}

/* content */
#content{
    display:none;
    position:relative;
    z-index:2;
    text-align:center;
}

/* nome */
.name{
    margin-top:60px;
    font-family:'Great Vibes';
    font-size:4rem;
    color:#ff85a2;
}

/* texto */
.letter{
    max-width:700px;
    margin:80px auto;
    font-size:1.1rem;
    line-height:1.8;
    padding:20px;
    text-align:left;
    min-height:200px;
}

/* US SECTION (7 slots) */
.us-section{
    max-width:900px;
    margin:60px auto;
    display:none; /* 👈 começa escondido */
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

/* US CARD */
.us-card{
    position:relative;
    height:160px;
    background:#000;
    border:1px solid #333;
    border-radius:15px;
    cursor:pointer;
    overflow:hidden;
}

/* texto US? */
.us-card::before{
    content:"US?";
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Great Vibes';
    font-size:2.5rem;
    color:#fff;
    transition:0.5s;
}

/* imagem */
.us-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:0.5s;
}

/* reveal */
.us-card.active img{
    opacity:1;
}

.us-card.active::before{
    opacity:0;
}

/* final */
.final{
    font-family:'Great Vibes';
    font-size:3.5rem;
    margin:120px 0;
    opacity:0;
    transform:scale(0.5);
    transition:1s;
}

.final.active{
    opacity:1;
    transform:scale(1.2);
    text-shadow:0 0 20px #ff4d6d;
}

/* botão música */
.music-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#ff4d6d;
    border:none;
    border-radius:50%;
    width:50px;
    height:50px;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="startScreen">
<h1>clique para entrar 🤍</h1>
</div>

<div id="content">

<h1 class="name">Gabrielly 💕</h1>

<div class="letter" id="typing"></div>

<!-- 7 US SLOTS -->
<section class="us-section">

<div class="us-card"><img src="img1.jpg"></div>
<div class="us-card"><img src="img2.jpg"></div>
<div class="us-card"><img src="img3.jpg"></div>
<div class="us-card"><img src="img4.jpg"></div>
<div class="us-card"><img src="img5.jpg"></div>
<div class="us-card"><img src="img6.jpg"></div>
<div class="us-card"><img src="img7.jpg"></div>

</section>

<div class="final" id="finalText">Eu te amo Gabrielly 💕</div>

</div>

<audio id="music" loop>
<source src="Arctic Monkeys - Do I Wanna Know_ (Lyrics) [PUL2mVdt3xo].mp3">
</audio>

<button class="music-btn" id="musicBtn">🔊</button>

<script>

/* estrelas */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.classList.add("star");
s.style.top=Math.random()*100+"vh";
s.style.left=Math.random()*100+"vw";
document.body.appendChild(s);
}

/* TEXTO COMPLETO */
const text=`Depois que eu vi aquilo que vc fez pra mim, eu fiquei um tempo olhando pra tela...

Não foi só por ler… foi porque eu senti cada palavra.

Eu não sei em que momento você virou alguém tão presente pra mim.

Hoje qualquer coisa que acontece eu penso em você.

E eu quero continuar com voce até o fim. 🤍`;

let i=0;
let started=false;

function typing(){
if(i < text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typing,30);
}else{

// 👇 QUANDO TERMINA TEXTO -> MOSTRA US
document.querySelector(".us-section").style.display = "grid";

document.getElementById("finalText").classList.add("active");
}
}

/* start */
document.getElementById("startScreen").onclick=()=>{
document.getElementById("startScreen").style.display="none";
document.getElementById("content").style.display="block";

let m=document.getElementById("music");
m.volume=0;
m.play();

let v=0;
let fade=setInterval(()=>{
if(v<0.4){v+=0.02;m.volume=v;}
else clearInterval(fade);
},200);

typing();
};

/* revelar US */
document.querySelectorAll(".us-card").forEach(card=>{
card.onclick=()=>card.classList.toggle("active");
});

/* música */
document.getElementById("musicBtn").onclick=()=>{
let m=document.getElementById("music");
m.paused?m.play():m.pause();
};

</script>

</body>
</html>
