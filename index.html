<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Texto + US animado</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family: Arial, Helvetica, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:80%;
  max-width:800px;
}

/* TEXTO */
#texto{
  font-size:18px;
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
}

/* US */
.us-container{
  margin-top:30px;
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:15px;
}

/* BOX */
.us-box{
  background:#000;
  border:1px solid #444;
  height:120px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  color:#aaa;
  border-radius:10px;

  opacity:0;
  transform: translateY(20px);
  position:relative;
  overflow:hidden;
}

/* entrada */
.us-box.show{
  animation: aparecer 0.6s ease forwards;
}

/* glitch nos US */
.us-box.show::before,
.us-box.show::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  opacity:0;
}

.us-box.show::before{
  background:#ff00ff;
  animation: glitch 1.2s infinite;
  mix-blend-mode:screen;
}

.us-box.show::after{
  background:#00ffff;
  animation: glitch 0.9s infinite;
  mix-blend-mode:screen;
}

@keyframes aparecer{
  from{
    opacity:0;
    transform: translateY(20px);
  }
  to{
    opacity:1;
    transform: translateY(0);
  }
}

@keyframes glitch{
  0%{transform:translate(0); opacity:0.2;}
  20%{transform:translate(-2px,2px);}
  40%{transform:translate(2px,-2px);}
  60%{transform:translate(-1px,1px);}
  80%{transform:translate(1px,-1px);}
  100%{transform:translate(0); opacity:0;}
}

</style>
</head>

<body>

<div class="container">

  <div id="texto"></div>

  <div class="us-container">
    <div class="us-box">US SLOT 1</div>
    <div class="us-box">US SLOT 2</div>
    <div class="us-box">US SLOT 3</div>
    <div class="us-box">US SLOT 4</div>
  </div>

</div>

<script>

const textoCompleto = `Depois que eu vi aquilo que vc fez pra mim, eu fiquei um tempo olhando pra tela depois de terminar de ler…

Não foi só por ler… foi porque eu senti cada palavra.

É estranho explicar, mas parecia que enquanto eu lia, eu tava revivendo tudo… cada conversa, cada momento simples que acabou ficando importante sem a gente nem perceber.

Eu não sei em que momento você virou alguém tão presente pra mim. Só sei que hoje, qualquer coisa que acontece, é automático pensar em você.

Tipo “preciso contar isso pra ela”.

Tem dias que eu nem tô tão bem, mas aí lembro de você… e parece que tudo fica mais leve.

Você tem esse jeito de acalmar as coisas dentro de mim sem nem tentar.

E eu gosto disso na gente.

Gosto de como é leve… mas ao mesmo tempo tão intenso.

Sem pressão, sem pressa, sem precisar definir tudo.

Só sendo.

E sendo algo bom.

Eu tambem não sei exatamente onde isso vai dar…

Mas sei que eu quero continuar com voce até o fim.

Sem pressa… mas só nós dois, do nosso jeito. 🤍`

const textoEl = document.getElementById("texto");
const usBoxes = document.querySelectorAll(".us-box");

let i = 0;

function digitar(){
  if(i < textoCompleto.length){
    textoEl.innerHTML += textoCompleto.charAt(i);
    i++;
    setTimeout(digitar, 18);
  } else {
    mostrarUS();
  }
}

function mostrarUS(){
  usBoxes.forEach((box, index) => {
    setTimeout(() => {
      box.classList.add("show");
    }, index * 300);
  });
}

digitar();

</script>

</body>
</html>
