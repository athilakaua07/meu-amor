<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Gabrielly 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#8b0000,#2d0000,#000);
    color:#fff;
    overflow-x:hidden;
}

/* CORAÇÕES (AGORA NO FUNDO) */
.heart{
    position:fixed;
    color:#ff4d6d;
    pointer-events:none;
    z-index:0;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(100vh);
        opacity:0;
    }
}

/* TELA INICIAL */
#startScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    cursor:pointer;
}

#startScreen h1{
    font-family:'Great Vibes';
    font-size:3rem;
}

/* CONTEÚDO */
#content{
    display:none;
    position:relative;
    z-index:2;
    text-align:center;
}

/* NOME */
.name{
    margin-top:80px;
    font-family:'Great Vibes';
    font-size:5rem;
    color:#ff85a2;
}

/* SEÇÃO AMOR */
.love-section{
    margin:80px auto;
    max-width:900px;
}

.love-item{
    margin-bottom:60px;
}

.love-text{
    font-family:'Great Vibes';
    font-size:2.5rem;
    margin-bottom:20px;
}

.love-item img{
    width:100%;
    border-radius:20px;
}

/* CARTA */
.letter{
    max-width:700px;
    margin:50px auto;
    font-size:1.2rem;
    line-height:1.8;
}
</style>
</head>

<body>

<div id="startScreen">
    <h1>clique para entrar 🤍</h1>
</div>

<audio id="music" loop>
    <source src="lonelyday.mp3" type="audio/mpeg">
</audio>

<div id="content">

<h1 class="name">Gabrielly 💕</h1>

<!-- SEQUÊNCIA DE AMOR -->
<section class="love-section">

<div class="love-item">
    <div class="love-text">Amo você como Leon ama Ada</div>
    <img src="leon.jpg">
</div>

<div class="love-item">
    <div class="love-text">Amo você como eu penso em você todos os dias</div>
    <img src="bob.jpg">
</div>

<div class="love-item">
    <div class="love-text">Amo você mesmo quando nem sei explicar</div>
    <img src="joe.jpg">
</div>

<div class="love-item">
    <div class="love-text">Amo você do nosso jeito</div>
    <img src="leon.jpg">
</div>

</section>

<div class="letter">
Eu não sei explicar exatamente quando você virou tudo isso pra mim…

Mas virou.

E eu só sei que quero continuar com você. 🤍
</div>

</div>

<script>

// ENTRAR + MÚSICA
document.getElementById("startScreen").onclick = () => {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("content").style.display = "block";

    const music = document.getElementById("music");
    music.volume = 0.4;
    music.play();
};

// CORAÇÕES NO FUNDO
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💕";

    heart.style.left = Math.random()*100+"vw";
    heart.style.fontSize = Math.random()*20+15+"px";
    heart.style.animationDuration = Math.random()*4+4+"s";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),7000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
